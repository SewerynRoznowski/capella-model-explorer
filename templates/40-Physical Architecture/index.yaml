- template: physical-capability.html.j2
  id: physical-capability
  name: Physical Capability
  description: Specifies what the physical system should be capable of and how it needs to interact with external actors.
  scope:
    type: CapabilityRealization
    below: pa
- template: physical-component-behavior.html.j2
  id: physical-component-behavior
  name: Physical Component (Behavior)
  description: Defines a behavioral (software) Physical Component
  isExperimental: true
  scope:
    type: PhysicalComponent
    below: pa
    filters:
      nature: BEHAVIOR
- template: physical-component.html.j2
  id: physical-component-node
  name: Physical Component (Node)
  description: Defines a Physical Component that is a node (hardware)
  isExperimental: true
  scope:
    type: PhysicalComponent
    below: pa
    filters:
      nature: NODE
- template: physical-link.html.j2
  id: physical-link
  name: Physical Interface
  description: Defines a Physical Interface between 2 components
  isExperimental: true
  scope:
    type: PhysicalLink
    below: pa
- template: physical-port.html.j2
  id: physical-port
  name: Physical Port
  description: Defines a Physical Port on a Physical Component
  isExperimental: true
  scope:
    type: PhysicalPort
    below: pa
- template: physical-function.html.j2
  id: physical-function
  name: Physical Functions
  description: Defines a function of a physical component or an actor that is carried out as a single step
  isExperimental: true
  scope:
    type: PhysicalFunction
    below: pa
    filters:
      sub_functions: empty
- template: physical-function-parent.html.j2
  id: physical-function-parent
  name: Parent Physical Functions
  description: A function that exists to organise sub-functions rather than to do work itself, with its boundary and its internal data flow
  isExperimental: true
  scope:
    type: PhysicalFunction
    below: pa
    filters:
      sub_functions: not_empty
- template: sw-interface.html.j2
  id: sw-interface
  name: Software Interfaces
  description: Defines interfaces between software components
  isExperimental: true
  scope:
    type: ComponentExchange
    below: pa
- template: ../functional-chain.html.j2
  id: functional-chain
  name: Functional Chain
  description: Defines a functional chain of involved functions and exchanges
  scope:
    type: FunctionalChain
