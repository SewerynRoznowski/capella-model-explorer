[build-system]
requires = [
  "setuptools>=80.9.0",
  "setuptools_scm[toml]>=9.2.0",
  "wheel>=0.45.1",
]
build-backend = "setuptools.build_meta"

[project]
dynamic = ["version"]

name = "capella-model-explorer"
description = "A webapp for exploring Capella models"
readme = "README.md"
requires-python = ">=3.11, <3.14"
license = "Apache-2.0"
license-files = ["LICENSES/*.txt"]
authors = [{ name = "DB InfraGO AG" }]
keywords = []
classifiers = [
  "Development Status :: 1 - Planning",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  # Supplies context_diagram and the rest of the generated diagrams,
  # including hierarchy_view, boundary_view and the
  # hide_non_leaf_functions render parameter that the function and
  # capability templates depend on. Those live in this fork and are
  # not in any release on PyPI, so a plain version requirement would
  # install an upstream build whose templates fail to render.
  #
  # Pinned to a commit for the same reason as mbse-artifact-viewer
  # below: a branch name moves without invalidating the Docker layer
  # that installs dependencies, so tracking one yields an image that
  # silently keeps whatever revision was current when that layer was
  # first built. Bumping this SHA is a commit here, which makes the
  # upgrade deliberate and visible in this repository's history.
  "capellambse-context-diagrams @ git+https://github.com/SewerynRoznowski/capellambse-context-diagrams.git@380e551c834aedf66042b795d7854c764837e6f1",
  "capellambse>=0.7.12",
  "click>=8.3.1",
  "jinja2>=3.1.6",
  "logfmter>=0.0.11",
  "lxml>=6.0.2",
  # Renders artifact folders (artifact.yaml manifests) bound to model
  # elements. A direct reference rather than a PyPI name: the package is
  # not published, and the name is unclaimed on PyPI, so a plain
  # requirement would resolve to nothing (or, one day, to somebody
  # else's package). The [pdf] extra is what lets a section ask for
  # pages 14-15 and get those pages rather than the whole document;
  # wireviz is declared below in its own right.
  #
  # Pinned to a commit, not @main. A Docker build caches the layer that
  # installs dependencies, and its cache key is the layers above it -
  # which do not change when a branch moves. Tracking @main therefore
  # produces an image that is neither reproducible nor updatable: it
  # silently keeps whatever revision was current when that layer was
  # first built. Bumping this SHA is a commit here, which invalidates the
  # COPY layer and makes the upgrade both deliberate and visible in this
  # repository's history.
  "mbse-artifact-viewer[pdf] @ git+https://github.com/SewerynRoznowski/Artifact-Renderer.git@f1cd01fdd0a4810e2f59effbea08b8ee4297e8cb",
  "prometheus-client>=0.23.1",
  "python-fasthtml>=0.12.35",
  "uvicorn>=0.38.0",
  "wireviz>=0.4.1",
]

[project.scripts]
cme = "capella_model_explorer.__main__:main"

[project.urls]
Homepage = "https://github.com/dbinfrago/capella-model-explorer"
Documentation = "https://dbinfrago.github.io/capella-model-explorer"

[dependency-groups]
dev = [
  "coverage>=7.13.0",
  "docformatter[tomli]==1.7.7",
  "mypy==1.19.0",
  "mypypp==0.1.1",
  "pre-commit>=4.5.0",
  "pre-commit-uv>=4.2.0",
  "pylsp-mypy>=0.7.0",
  "pytest>=9.0.2",
  "pytest-cov>=7.0.0",
  "python-dotenv>=1.2.1",
  "python-lsp-server[rope]>=1.14.0",
  "reuse==6.2.0",
  "ruff==0.14.9",
  "types-pyyaml>=6.0.12.20250915",
  "types-lxml==2025.11.25",
]

docs = ["furo>=2025.9.25", "sphinx>=8.2.3", "sphinx-copybutton>=0.5.2"]

[tool.coverage.run]
branch = true
command_line = "-m pytest"
source = ["capella_model_explorer"]

[tool.coverage.report]
exclude_also = [
  'if t\.TYPE_CHECKING:',
  'class .*\bt\.Protocol\):',
  '@abc\.abstractmethod',
  '@t\.overload',
]
skip_covered = true

[tool.docformatter]
wrap-descriptions = 72
wrap-summaries = 79

[tool.mypy]
check_untyped_defs = true
disable_error_code = ["name-defined"]
disallow_incomplete_defs = false
disallow_untyped_defs = false
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_unreachable = true
plugins = ["mypypp.deprecated"]
python_version = "3.11"

[[tool.mypy.overrides]]
# Untyped third party libraries
module = ["fasthtml.*", "requests.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = """
  -W error::pytest.PytestUnraisableExceptionWarning
  --import-mode=importlib
  --strict-config
  --strict-markers
"""
testpaths = ["tests"]
xfail_strict = true

[tool.ruff]
line-length = 79

[tool.ruff.lint]
extend-select = [
  "ARG",    # flake8-unused-arguments
  "B",      # flake8-bugbear
  "C4",     # flake8-comprehensions
  "C90",    # mccabe
  "D",      # pydocstyle
  "D212",   # "Multi-line docstring summary should start at the first line"
  "D402",   # "First line should not be the function’s 'signature'"
  "D417",   # "Missing argument descriptions in the docstring"
  "DTZ",    # flake8-datetimez
  "ERA",    # eradicate
  "FA",     # flake8-future-annotations
  "FBT",    # flake8-boolean-trap
  "FIX",    # flake8-fixme
  "FURB",   # refurb
  "G",      # flake8-logging-format
  "I",      # isort
  "ICN",    # flake8-import-conventions
  "ISC001", # "Implicitly concatenated string literals on one line"
  "ISC003", # "Explicitly concatenated string should be implicitly concatenated"
  "LOG",    # flake8-logging
  "PIE",    # flake8-pie
  "PL",     # pylint
  "PT",     # flake8-pytest-style
  "RET",    # flake8-return
  "RUF",    # ruff
  "SIM",    # flake8-simplify
  "TC005",  # "Found empty type-checking block"
  "T10",    # flake8-debugger
  "UP",     # pyupgrade
  "YTT",    # flake8-2020
]
ignore = [
  "D1",      # Missing docstring in _
  "D201",    # No blank lines allowed before function docstring  # auto-formatting
  "D202",    # No blank lines allowed after function docstring  # auto-formatting
  "D203",    # 1 blank line required before class docstring  # auto-formatting
  "D204",    # 1 blank line required after class docstring  # auto-formatting
  "D211",    # No blank lines allowed before class docstring  # auto-formatting
  "D213",    # Multi-line docstring summary should start at the second line
  "DTZ001",  # `tzinfo=None` passed to `datetime.datetime()`
  "DTZ005",  # `tz=None` passed to `datetime.datetime.now()`
  "E402",    # Module level import not at top of file
  "F403",    # `from _ import *` used; unable to detect undefined names
  "F405",    # `_` may be undefined, or defined from star imports
  "PLC0414", # Import alias does not rename original package # used for explicit reexports
  "PLR0904", # Too many public methods
  "PLR0911", # Too many return statements
  "PLR0912", # Too many branches
  "PLR0913", # Too many arguments in function definition
  "PLR0914", # Too many local variables
  "PLR0915", # Too many statements
  "PLR0916", # Too many Boolean expressions
  "PLR0917", # Too many positional arguments
  "SIM108",  # Use ternary operator instead of `if`-`else`-block
]

[tool.ruff.lint.extend-per-file-ignores]
"__init__.py" = [
  "PLE0604", # Invalid object in `__all__`, must contain only strings  # false-positive when unpacking imported submodule __all__
]
"tests/test_*.py" = [
  "F811",    # Redefinition of unused `_` from line _
  "PLR2004", # Magic value used in comparison, consider replacing `_` with a constant variable
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
ignore-decorators = ["typing.overload"]

[tool.ruff.lint.mccabe]
max-complexity = 14

[tool.setuptools]
platforms = ["any"]
zip-safe = false

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.setuptools.packages.find]
include = ["capella_model_explorer", "capella_model_explorer.*"]

[tool.setuptools_scm]
# This section must exist for setuptools_scm to work
local_scheme = "no-local-version"
